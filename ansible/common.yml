---
- name: Baseline security hardening (all servers)
  hosts: all
  become: true
  tags: [hardening]

  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name: [ufw, fail2ban, unattended-upgrades, acl, rsync, ca-certificates, curl, gnupg, python3-debian]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Harden sshd (key-only auth, no root login)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-hardening.conf
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          X11Forwarding no
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 2
          AllowUsers {{ ansible_user }}
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: UFW - default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: UFW - default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: UFW - allow required ports
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ item.port }}"
        from_ip: "{{ item.src }}"
        comment: "{{ item.comment }}"
      loop: "{{ ufw_allow_rules }}"

    - name: UFW - enable
      community.general.ufw:
        state: enabled

    - name: Enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
